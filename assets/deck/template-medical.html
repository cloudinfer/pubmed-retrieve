<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --ink:#0A1B2E;
  --ink-2:#4A5C72;
  --ink-3:#8593A3;
  --anchor:#0A3D7C;
  --anchor-2:#2E6BA8;
  --anchor-3:#8FB3D9;
  --wash:#EEF3F9;
  --hairline:#CBD7E4;
  --paper:#FFFFFF;
  --alert:#B01E28;
  --font-sans:"Inter","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  --font-num:"Inter","Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#DFE5EC;color:var(--ink);
  font-family:var(--font-sans);font-weight:400;overflow:hidden}
body{-webkit-font-smoothing:antialiased}

#deck{position:fixed;left:50%;top:50%;width:1600px;height:900px;
  margin-left:-800px;margin-top:-450px;transform:scale(var(--s,1));transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--paper);color:var(--ink);
  opacity:0;visibility:hidden;transition:opacity .26s ease}
.slide.active{opacity:1;visibility:visible}
.slide[data-dark="1"]{--ink:#FFFFFF;--ink-2:#8FB3D9;--ink-3:#CBD7E4;
  --hairline:#2E6BA8;background:var(--anchor)}

.frame{position:absolute;inset:0;padding:88px 96px 84px;display:flex;flex-direction:column}
.head{display:flex;justify-content:space-between;align-items:baseline;flex:0 0 auto}
.foot{display:flex;justify-content:space-between;align-items:baseline;flex:0 0 auto;gap:24px}
.rule{height:1px;background:var(--hairline);flex:0 0 auto;margin:14px 0}
.body{flex:1 1 auto;display:grid;grid-template-columns:repeat(16,1fr);
  column-gap:24px;row-gap:24px;align-content:start;align-items:start}

.eyebrow{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.pageno{font-family:var(--font-num);font-size:13px;font-weight:500;letter-spacing:.08em;
  color:var(--ink-3);font-variant-numeric:tabular-nums}
.t-display{font-size:72px;font-weight:500;letter-spacing:-.02em;line-height:1.12}
.t-h1{font-size:56px;font-weight:500;letter-spacing:-.01em;line-height:1.16}
.t-h2{font-size:40px;font-weight:500;line-height:1.24}
.t-h3{font-size:28px;font-weight:500;line-height:1.32}
.t-body{font-size:20px;font-weight:400;line-height:1.6}
.t-bodys{font-size:17px;font-weight:400;line-height:1.62;line-break:strict}
.t-cap{font-size:15px;font-weight:400;line-height:1.5;color:var(--ink-3)}
.t-kpi-xl{font-family:var(--font-num);font-size:160px;font-weight:500;letter-spacing:-.04em;
  line-height:1;color:var(--anchor);font-variant-numeric:tabular-nums}
.t-kpi-l{font-family:var(--font-num);font-size:96px;font-weight:500;letter-spacing:-.03em;
  line-height:1;color:var(--anchor);font-variant-numeric:tabular-nums}
.t-num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.t-mono{font-family:var(--font-mono);font-size:17px;font-weight:400;line-height:1.7;
  word-break:break-word}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.anchor{color:var(--anchor)}
.alert{color:var(--alert)}
.slide[data-dark="1"] .t-kpi-xl,.slide[data-dark="1"] .t-kpi-l,.slide[data-dark="1"] .anchor{color:var(--paper)}

.wash{background:var(--wash);border:1px solid var(--hairline);padding:24px}
.quote{border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);padding:20px 0}
.stack>.row{padding:14px 0;border-top:1px solid var(--hairline)}
.stack>.row:first-child{border-top:0}
.stack>.row:last-child{border-bottom:1px solid var(--hairline)}
.kv{display:flex;gap:24px;align-items:baseline}
.kv>.k{flex:0 0 132px;font-size:13px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2)}
.kv>.v{flex:1 1 auto}

.tower{display:grid;grid-template-columns:repeat(4,1fr);column-gap:0;align-items:end;height:340px}
.tower>.cell{padding:0 28px;border-left:1px solid var(--hairline);display:flex;
  flex-direction:column;justify-content:flex-end;height:100%}
.tower>.cell:first-child{border-left:0;padding-left:0}
.tower>.cell>.lab{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);margin-bottom:12px}
.tower>.cell>.unit{font-size:17px;color:var(--ink-2);margin:6px 0 0}
.tower>.cell>.note{font-size:15px;color:var(--ink-3);margin-top:4px}

.bar-row{grid-column:1/12;display:grid;grid-template-columns:4fr 7fr 1fr;column-gap:24px;
  align-items:center;padding:5px 0}
.bar-row>.name{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row>.track{display:block;height:24px;background:var(--wash)}
.bar-row>.track>i{display:block;height:24px;background:var(--anchor)}
.bar-row>.val{font-size:17px;text-align:right;color:var(--ink-2)}

.topic-row{display:grid;grid-template-columns:4fr 8fr 2fr;column-gap:24px;align-items:center;
  padding:10px 0;border-top:1px solid var(--hairline)}
.topic-row>.tname{font-size:17px}
.topic-row>.tval{font-size:17px;text-align:right;color:var(--ink-2);white-space:nowrap}
.topicbar{height:20px;background:var(--wash)}
.topicbar>i{display:block;height:20px;background:var(--anchor)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:32px 40px}
.card{border-top:2px solid var(--anchor);padding-top:16px}
.card>.meta{font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);margin-bottom:10px}
.card>.ttl{font-size:17px;line-height:1.55;height:5.0em;overflow:hidden}
.card>.foot2{display:flex;justify-content:space-between;gap:16px;margin-top:12px}
.card>.foot2>.pmid{font-family:var(--font-mono);font-size:15px;color:var(--ink-3)}
.card>.foot2>.why{font-size:15px;color:var(--anchor);text-align:right}

.duo{display:grid;grid-template-columns:1fr 1px 1fr;column-gap:48px;min-height:400px}
.duo>.divider{background:var(--hairline)}
.chart{display:block;width:100%;height:auto}
.list>.item{padding:12px 0;border-top:1px solid var(--hairline);font-size:17px;line-height:1.6}
.third{display:grid;grid-template-columns:repeat(3,1fr);column-gap:40px}

#progress{position:fixed;left:0;top:0;height:3px;background:var(--anchor);width:0;z-index:40}
#dots{position:fixed;left:0;right:0;bottom:12px;display:flex;justify-content:center;
  gap:8px;z-index:40}
#dots>i{width:12px;height:3px;background:#A9B6C6;cursor:pointer;display:block}
#dots>i.on{background:var(--anchor)}
#overview{position:fixed;inset:0;background:#0A1B2E;z-index:50;display:none;
  padding:48px;overflow:auto}
#overview.on{display:block}
#overview .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
#overview .cell{background:var(--paper);cursor:pointer;overflow:hidden;position:relative;
  height:150px}
#overview .cell>.tag{position:absolute;left:8px;bottom:6px;font-size:13px;color:var(--ink-2);z-index:2}
#overview .cell>.scale{position:absolute;left:0;top:0;width:1600px;height:900px;
  transform:scale(.1556);transform-origin:top left}
#overview .cell>.scale .slide{opacity:1;visibility:visible;transition:none}

@media print{
  html,body{overflow:visible;background:#FFF}
  #progress,#dots,#overview{display:none}
  #deck{position:static;margin:0;transform:none;width:1600px;height:auto}
  .slide{position:relative;inset:auto;opacity:1;visibility:visible;
    page-break-after:always;break-after:page}
  @page{size:1600px 900px;margin:0}
}
@media (prefers-reduced-motion: reduce){
  .slide{transition:none}
}
</style>
</head>
<body>
<div id="progress"></div>
<main id="deck">
{{SLIDES}}
</main>
<nav id="dots"></nav>
<div id="overview"><div class="grid" id="ovgrid"></div></div>
<script>
(function(){
  var deck=document.getElementById('deck');
  var slides=[].slice.call(deck.querySelectorAll('.slide'));
  var n=slides.length; if(!n) return;
  var dots=document.getElementById('dots');
  var ov=document.getElementById('overview');
  var ovgrid=document.getElementById('ovgrid');
  var bar=document.getElementById('progress');
  var cur=0, lock=0;

  slides.forEach(function(s,idx){
    var d=document.createElement('i');
    d.title=s.getAttribute('data-title')||('第 '+(idx+1)+' 页');
    d.addEventListener('click',function(){go(idx)});
    dots.appendChild(d);
    var cell=document.createElement('div');
    cell.className='cell';
    var scale=document.createElement('div');
    scale.className='scale';
    var clone=s.cloneNode(true);
    clone.classList.add('active');
    scale.appendChild(clone);
    cell.appendChild(scale);
    var tag=document.createElement('div');
    tag.className='tag';
    tag.textContent=(idx+1)+' · '+(s.getAttribute('data-title')||'');
    cell.appendChild(tag);
    cell.addEventListener('click',function(){ov.classList.remove('on');go(idx)});
    ovgrid.appendChild(cell);
  });

  function paint(){
    slides.forEach(function(s,idx){s.classList.toggle('active',idx===cur)});
    [].forEach.call(dots.children,function(d,idx){d.classList.toggle('on',idx===cur)});
    bar.style.width=((cur+1)/n*100)+'%';
    if(history.replaceState) history.replaceState(null,'','#'+(cur+1));
  }
  function go(idx){cur=Math.max(0,Math.min(n-1,idx));paint()}
  function step(delta){
    var t=Date.now(); if(t-lock<270) return; lock=t; go(cur+delta);
  }
  function fit(){
    var s=Math.min(window.innerWidth/1600,window.innerHeight/900);
    document.documentElement.style.setProperty('--s',String(s));
  }
  window.addEventListener('resize',fit); fit();

  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){e.preventDefault();step(1)}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();step(-1)}
    else if(k==='Home'){e.preventDefault();go(0)}
    else if(k==='End'){e.preventDefault();go(n-1)}
    else if(k==='g'||k==='G'){e.preventDefault();ov.classList.toggle('on')}
    else if(k==='Escape'){ov.classList.remove('on')}
  });
  window.addEventListener('wheel',function(e){
    if(ov.classList.contains('on')) return;
    if(Math.abs(e.deltaY)<8) return;
    step(e.deltaY>0?1:-1);
  },{passive:true});
  var tx=0,ty=0;
  window.addEventListener('touchstart',function(e){
    tx=e.touches[0].clientX; ty=e.touches[0].clientY;
  },{passive:true});
  window.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-tx;
    var dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)) go(cur+(dx<0?1:-1));
  },{passive:true});

  var h=parseInt((location.hash||'').replace('#',''),10);
  if(h>0&&h<=n) cur=h-1;
  paint();
})();
</script>
</body>
</html>
